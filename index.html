<style>
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--paper:#242424;--ink:#ffffff;--soft:#a0a0a0;
  --line:#333333;--line2:#404040;--accent:#d4af37;--accent-l:#2d2618;--chord:#ffb37a;
  --ok:#5fa575;--danger:#d87862;--r:16px;
  --sh:0 2px 8px rgba(0,0,0,.8),0 8px 24px -8px rgba(0,0,0,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 50%,#0f0f0f 100%);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.55;padding-bottom:130px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0;letter-spacing:.01em}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
a{color:var(--accent);text-underline-offset:3px}
.muted{color:var(--soft)}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#1a1a1a 0%,#0f0f0f 70%,rgba(15,15,15,.94) 100%);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);padding:16px 18px 0}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:48px;height:48px;flex:0 0 48px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 4px 16px -4px rgba(212,175,55,.5)}
.brand h1{font-size:1.5rem;line-height:1.05;font-weight:700;letter-spacing:.02em}
.kicker{display:block;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px}
.lockbtn{margin-left:auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 15px;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
.lockbtn.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:2px;margin-top:16px}
.tab{flex:1;padding:14px 4px 12px;border:none;background:none;cursor:pointer;position:relative;font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--soft)}
.tab.active{color:var(--accent)}
.tab.active::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;background:var(--accent)}
main{max-width:860px;margin:0 auto;padding:22px 18px 40px}
.orn{display:flex;align-items:center;gap:14px;margin:28px 0 16px}
.orn h2{font-size:1.6rem;white-space:nowrap;font-weight:700}
.orn .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.orn .dot{color:var(--accent);font-size:.8rem}
.empty{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:40px 22px;text-align:center;color:var(--soft);box-shadow:var(--sh)}
.empty i{display:block;font-style:normal;font-size:2rem;margin-bottom:8px;color:var(--accent);opacity:.6}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),#8b7a4f)}
.card-body{padding:20px 20px 20px 22px}
.evt-head{display:flex;gap:16px;align-items:flex-start}
.datebox{flex:0 0 66px;text-align:center;background:var(--accent-l);border:1px solid var(--accent);border-radius:14px 14px 10px 10px;padding:9px 4px 8px}
.datebox .m{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.datebox .d{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;line-height:1;color:var(--accent)}
.datebox .w{font-size:.6rem;color:var(--soft);letter-spacing:.06em}
.evt-title{font-size:1.65rem;line-height:1.12;font-weight:700}
.evt-time{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:3px}
.meta{display:flex;gap:9px;align-items:flex-start;font-size:.92rem;color:var(--soft);margin-top:12px;line-height:1.4}
.meta .ic{flex:0 0 auto;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.chip{background:var(--accent-l);border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:600}
.chip.plain{background:var(--bg2);border-color:var(--line);color:var(--soft)}
a.chip{text-decoration:none;display:inline-block}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btn{border-radius:12px;padding:13px 18px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.94rem;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.4);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#c89ba8,var(--accent));border-color:var(--accent);color:#000;font-weight:700}
.btn.gold{background:linear-gradient(180deg,#b8970d,var(--accent));border-color:var(--accent);color:#000;font-weight:700}
.btn.danger{color:var(--danger);border-color:#6d4c42;background:var(--paper)}
.btn.block{width:100%}
.btn.sm{padding:9px 13px;font-size:.83rem;border-radius:10px}
.btn.icon{padding:9px 11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:45;background:linear-gradient(180deg,#b8970d,var(--accent));color:#000;border:none;border-radius:999px;padding:17px 26px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 10px 26px -8px rgba(212,175,55,.8)}
.acc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:30px;box-shadow:var(--sh)}
.acc-head{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:20px;display:flex;align-items:center;gap:12px;font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700}
.acc-head .count{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-l);border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.acc-body{padding:0 14px 16px;display:none}
.acc.open .acc-body{display:block}
.acc.open .caret{transform:rotate(180deg)}
.caret{transition:transform .2s;color:var(--accent)}
.past .card{opacity:.6}
.past .card::before{background:#5a5248}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.searchwrap{position:relative;margin-bottom:18px}
.search{width:100%;padding:16px 16px 16px 46px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--sh)}
.searchwrap .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--soft)}
.song{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:11px;box-shadow:var(--sh);cursor:pointer}
.song-acts{display:flex;flex-direction:column;align-items:stretch;gap:6px;flex:0 0 auto}
.song-acts .keyb{text-align:center}
.song:active{background:rgba(212,175,55,.1)}
.num{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:linear-gradient(135deg,#3d3420,#2d2418);border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.si-info{flex:1;min-width:0}
.si-info h3{font-size:1.3rem;line-height:1.18;font-weight:600;overflow-wrap:break-word;word-break:normal}
.si-info p{margin:1px 0 0;font-size:.85rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keyb{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:6px 11px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem;color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 34px);animation:up .24s cubic-bezier(.2,.8,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.9)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet-head h2{font-size:1.6rem;flex:1;font-weight:700;line-height:1.15}
.x{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:42px;height:42px;font-size:1rem;cursor:pointer;flex:0 0 42px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:18px 0 8px}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:230px;font-family:'JetBrains Mono',monospace;font-size:.9rem;line-height:1.55;white-space:pre;overflow-x:auto}
.hint{font-size:.8rem;color:var(--soft);margin-top:8px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:10px;align-items:stretch}
.inline input{flex:1;min-width:0}
.picker{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--sh)}
.pick{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.pick:last-child{border-bottom:none}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 22px}
.pick span{flex:1;min-width:0}
.pick b{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;overflow-wrap:break-word;word-break:normal}
iframe.map{width:100%;height:210px;border:0;border-radius:14px;margin-top:12px;background:#000;box-shadow:var(--sh)}
.sugg{background:var(--paper);border:1px solid var(--line);border-radius:13px;margin-top:8px;overflow:hidden;box-shadow:var(--sh);display:none}
.sugg.show{display:block}
.sugg div{padding:13px 15px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:.88rem;line-height:1.35}
.sugg div:last-child{border-bottom:none}
.daterow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.daterow input[type=date]{flex:1.3;min-width:0}
.daterow input[type=time]{flex:1;min-width:0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #5a5248;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--sh);margin-top:6px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:13px 8px;font-weight:700;font-size:.92rem;cursor:pointer;color:var(--soft)}
.seg button.on{background:linear-gradient(180deg,#8b970d,var(--accent));color:#000;box-shadow:0 4px 12px -6px rgba(212,175,55,.8)}
.panel{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.res{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);background:var(--paper);border-radius:14px;margin-bottom:10px;box-shadow:var(--sh)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;line-height:1.15;overflow-wrap:break-word;word-break:normal}
.res .t span{font-size:.85rem;color:var(--soft)}
.counter{font-size:.8rem;color:var(--soft);margin:16px 0 10px;letter-spacing:.02em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px 20px;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.95);animation:up .2s}
.modal-box h3{font-family:'Playfair Display',serif;font-size:1.45rem;margin-bottom:16px;text-align:center}
.modal-box .acts{flex-direction:column;margin:0}
.modal-box .btn{width:100%}
#viewer{position:fixed;inset:0;background:var(--paper);z-index:80;display:none;flex-direction:column}
#viewer.show{display:flex}
.v-top{display:flex;align-items:center;gap:11px;padding:16px 15px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a1a1a,#0f0f0f)}
.v-top h2{font-size:1.25rem;flex:1;line-height:1.12;font-weight:700;min-width:0;overflow-wrap:break-word;word-break:normal}
.v-top h2 small{display:block;font-family:'Inter';font-size:.68rem;color:var(--soft);font-weight:500;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#area{flex:1;overflow-y:auto;padding:20px 18px 220px}
pre.cifra{font-family:'JetBrains Mono',monospace;font-size:21px;line-height:1.8;white-space:pre;margin:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
pre.cifra b.ch{color:var(--chord);font-weight:700}
pre.cifra i.sec{color:var(--chord);font-style:normal;font-weight:700;letter-spacing:.03em;opacity:1}
.v-bar{border-top:1px solid var(--line);background:linear-gradient(180deg,#0f0f0f,#1a1a1a);padding:13px 15px calc(env(safe-area-inset-bottom) + 15px);display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:8px}
.ctrl{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;min-width:48px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.clabel{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);min-width:52px}
.play{flex:1;background:linear-gradient(180deg,#8b970d,var(--accent));border-color:var(--accent);color:#000;font-size:1.05rem;padding:15px;border:1px solid var(--accent);font-weight:700}
.play.on{background:linear-gradient(180deg,#4a7d57,var(--ok));border-color:var(--ok)}
input[type=range]{flex:1;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);z-index:99;background:#0a0705;color:#fff;padding:13px 22px;border-radius:999px;font-size:.86rem;font-weight:500;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;border:1px solid var(--line)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:720px){body{font-size:19px}pre.cifra{font-size:23px}.evt-title{font-size:1.85rem}}
</style>
</head>

<script>
var _qs = new URLSearchParams(location.search);
var SHARED_VIEW = _qs.get('view') || '';
var SHARED_ID = _qs.get('id') || '';
var DB_KEY = 'fortalecer_db_v1';
var db = {pass:'ministerio2024',songs:[],events:[],collections:[],notifications:[]};
var isAdmin = sessionStorage.getItem('adm')==='1';
var tab = 'eventos', routeEvent = null;
var dataLoaded = false;

/* Armazenamento local (localStorage) — este app é 100% estático (GitHub Pages),
   sem backend, então os dados ficam salvos no navegador de cada dispositivo. */
function loadData(){
  try{
    var raw=localStorage.getItem(DB_KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(!d.collections) d.collections=[];
      if(!d.notifications) d.notifications=[];
      return d;
    }
  }catch(err){}
  var seeded=seedData_();
  try{ localStorage.setItem(DB_KEY, JSON.stringify(seeded)); }catch(err){}
  return seeded;
}
function seedData_(){
  function suid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  var s1=suid(),s2=suid(),s3=suid(),s4=suid(),s5=suid(),s6=suid(),s7=suid(),s8=suid();
  var songs=[
    {id:s1,title:'Teu Santo Nome',artist:'Ministério Zoe',key:'G',link:'',refs:[],body:'[Intro]\nG  D  Em  C\n\n[Primeira Parte]\nG                 D\nTu és o Deus que vem\n       Em            C\nE que habita entre nós\nG                  D\nTua glória enche o céu\n        Em          C\nE a terra ouve a Tua voz\n\n[Refrão]\n      G           D\nSanto, santo é o Senhor\n      Em            C\nDigno de todo louvor'},
    {id:s2,title:'Ave Maria de Fátima',artist:'Tradicional',key:'D',link:'',refs:[],body:'[Intro]\nD  A  Bm  G\n\n[Verso 1]\nD                 A\nAve, ave, ave Maria\nBm               G\nAve, ave, ave Maria\nD                 A\nCheia de graça\nBm                G\nRainha da paz'},
    {id:s3,title:'Eu Navegarei',artist:'Tradicional Católica',key:'E',link:'',refs:[],body:'[Intro]\nE  A  B7  E\n\n[Verso 1]\nE                          B7\nEu navegarei no oceano do Espírito\nE7                     A\nSem medo das ondas que virão'},
    {id:s4,title:'Segura na Mão de Deus',artist:'Tradicional',key:'G',link:'',refs:[],body:'[Intro]\nG  C  G  D\n\n[Verso 1]\nG                         C\nSe as águas do mar da vida\nG                    D\nQuiserem te submergir'},
    {id:s5,title:'Vem, Espírito Santo',artist:'Canção Nova',key:'D',link:'',refs:[],body:'[Intro]\nD  Bm  G  A\n\n[Verso 1]\nD                Bm\nVem, Espírito Santo\nG                  A\nVem encher nosso coração'},
    {id:s6,title:'Ofertório - A Ti Senhor',artist:'Tradicional',key:'A',link:'',refs:[],body:'[Intro]\nA  E  F#m  D\n\n[Verso 1]\nA              E\nA Ti, Senhor, ofertamos\nF#m                D\nNosso pão e nosso vinho'},
    {id:s7,title:'Ide por Todo o Mundo',artist:'Comunidade Canção Nova',key:'C',link:'',refs:[],body:'[Intro]\nC  G  Am  F\n\n[Verso 1]\nC                    G\nIde por todo o mundo\nAm                   F\nProclamai o Evangelho'},
    {id:s8,title:'Santo Missa',artist:'Ministério',key:'D',link:'',refs:[],body:'[Intro]\nD  A  D  A\n\n[Verso 1]\nD              A\nSanto, santo, santo\nD                A\nÉ o Senhor Deus'}
  ];
  var d=new Date(); d.setDate(d.getDate()+((7-d.getDay())%7||7));
  var ns=d.toISOString().slice(0,10);
  return {
    pass:'ministerio2024',
    songs:songs,
    events:[{id:suid(),title:'Missa Dominical',dates:[{date:ns,start:'19:00',end:''}],rehearsals:[{date:ns,start:'18:00',end:'18:45',place:''}],createdAt:Date.now(),address:'Paróquia Nossa Senhora Aparecida, Jacareí - SP',lat:null,lng:null,notes:'',songs:[s1,s2]}],
    collections:[],
    notifications:[]
  };
}
function boot(){
  db = loadData();
  migrateDb();
  dataLoaded = true;
  if(SHARED_VIEW && SHARED_ID){
    enterSharedView();
    return;
  }
  renderAll(); setTab('eventos');
  document.getElementById('notifBtn').hidden = false;
  updateNotifBadge();
  startNotifPolling();
  setTimeout(maybeAskNotifPermission, 2500);
}
/* Migra eventos/cifras do formato antigo (data única) para o novo (múltiplas datas + referências). */
function migrateDb(){
  var changed=false;
  (db.events||[]).forEach(function(e){
    if(!e.dates || !e.dates.length){
      e.dates=[{date:e.date||nextSunday(),start:e.time||'',end:''}];
      changed=true;
    }
    if(!e.rehearsals) { e.rehearsals=[]; changed=true; }
    if(typeof e.createdAt!=='number'){ e.createdAt=0; changed=true; }
  });

  });
  if(!db.notifications){ db.notifications=[]; changed=true; }
  if(changed) persist();
}

/* NOTIFICAÇÕES — avisa os usuários (viewers) quando um novo evento é criado.
   Funciona por sondagem periódica + Notification API em primeiro plano (a aba precisa
   estar aberta); não há push em segundo plano, pois o Apps Script não oferece esse serviço. */
var NOTIF_SEEN_KEY='fortalecer_notif_last_seen';
var _notifPoll=null;
function getLastSeenTs(){ return parseInt(localStorage.getItem(NOTIF_SEEN_KEY)||'0',10); }
function setLastSeenTs(ts){ localStorage.setItem(NOTIF_SEEN_KEY,String(ts)); }
function updateNotifBadge(){
  var badge=document.getElementById('notifBadge');
  if(!badge) return;
  var unread=(db.notifications||[]).filter(function(n){return n.createdAt>getLastSeenTs();}).length;
  if(unread>0){ badge.textContent=unread>9?'9+':String(unread); badge.style.display='block'; }
  else { badge.style.display='none'; }
}
/* Sem backend, a "notificação entre usuários" funciona entre abas/janelas do mesmo
   navegador (via evento 'storage' do localStorage) — não há sincronização entre
   dispositivos diferentes sem um servidor. */
function startNotifPolling(){
  if(_notifPoll) return;
  _notifPoll = true;
  window.addEventListener('storage', function(ev){
    if(ev.key!==DB_KEY || !ev.newValue) return;
    try{
      var fresh=JSON.parse(ev.newValue);
      var prevIds=(db.notifications||[]).map(function(n){return n.id;});
      var list=fresh.notifications||[];
      var newOnes=list.filter(function(n){return prevIds.indexOf(n.id)===-1;});
      db=fresh;
      renderAll();
      if(newOnes.length && 'Notification' in window && Notification.permission==='granted'){
        newOnes.forEach(function(n){
          try{ new Notification('Novo evento: '+n.title,{body:'Toque para ver os detalhes no app.'}); }catch(err){}
        });
      }
    }catch(err){}
  });
}
function maybeAskNotifPermission(){
  if(!('Notification' in window) || Notification.permission!=='default') return;
  Notification.requestPermission();
}
function toggleNotifPanel(){
  var list=(db.notifications||[]).slice().sort(function(a,b){return b.createdAt-a.createdAt;});
  var html=list.length ? list.map(function(n){
    var when=new Date(n.createdAt);
    var whenStr=String(when.getDate()).padStart(2,'0')+'/'+String(when.getMonth()+1).padStart(2,'0')+' às '+String(when.getHours()).padStart(2,'0')+':'+String(when.getMinutes()).padStart(2,'0');
    return '<div class="song" style="cursor:pointer" onclick="closeSheet();openEvent(\''+n.eventId+'\')"><div class="num">🔔</div>'+
      '<div class="si-info"><h3>'+esc(n.title)+'</h3><p>Novo evento criado · '+whenStr+'</p></div></div>';
  }).join('') : '<div class="empty"><i>🔔</i>Nenhuma notificação por aqui ainda.</div>';
  openSheet('<div class="sheet-head"><h2>Notificações</h2><button class="x" onclick="closeSheet()">✕</button></div>'+html);
  setLastSeenTs(Date.now());
  updateNotifBadge();
}
function pushEventNotification(eventId,title){
  db.notifications=db.notifications||[];
  db.notifications.push({id:uid(),eventId:eventId,title:title,createdAt:Date.now()});
  if(db.notifications.length>80) db.notifications=db.notifications.slice(-80);
  setLastSeenTs(Date.now()); /* quem cria o evento não precisa ver a própria notificação como não lida */
}

var MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
var MESF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIA=['dom','seg','ter','qua','qui','sex','sáb'];
var DIAF=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function parseD(d){var p=d.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function eventDates(e){ return (e.dates&&e.dates.length) ? e.dates : [{date:e.date||nextSunday(),start:e.time||'',end:''}]; }
function sortedDates(list){ return list.slice().sort(function(a,b){return (a.date+(a.start||'')).localeCompare(b.date+(b.start||''));}); }
function lastDateOf(e){ var ds=sortedDates(eventDates(e)); return ds[ds.length-1]; }
function repDateOf(e){
  var ds=sortedDates(eventDates(e)), now=new Date();
  for(var i=0;i<ds.length;i++){ var dt=parseD(ds[i].date); dt.setHours(23,59); if(dt>=now) return ds[i]; }
  return ds[ds.length-1];
}
function isPast(e){ var ld=lastDateOf(e); var dt=parseD(ld.date); dt.setHours(23,59); return dt<new Date(); }
function fmtDateShort(d){ var dt=parseD(d.date); return String(dt.getDate()).padStart(2,'0')+' '+MES[dt.getMonth()].toLowerCase(); }
function fmtDateFull(d){ var dt=parseD(d.date); return DIAF[dt.getDay()]+', '+dt.getDate()+' de '+MESF[dt.getMonth()]; }
function fmtDateTime(d){ var s=fmtDateFull(d); if(d.start) s+=' · '+d.start+(d.end?'–'+d.end:''); if(d.place) s+=' · '+d.place; return s; }
function datesLabel(list){ return sortedDates(list).map(fmtDateShort).join(', '); }
function rehLabel(list){
  return sortedDates(list).map(function(d){
    var dt=parseD(d.date);
    var s=DIAF[dt.getDay()]+' '+String(dt.getDate()).padStart(2,'0')+' '+MES[dt.getMonth()];
    if(d.start) s+=' às '+d.start+(d.end?'–'+d.end:'');
    if(d.place) s+=' ('+d.place+')';
    return s;
  }).join(', ');
}
function datesListHtml(list,icon){
  return sortedDates(list).map(function(d){
    return '<div class="meta"><span class="ic">'+icon+'</span><span>'+esc(fmtDateTime(d))+'</span></div>';
  }).join('');
}

function eventCard(e){
  var ds=eventDates(e);
  var rep=repDateOf(e);
  var dt=parseD(rep.date);
  var songs=e.songs.map(function(i){return db.songs.find(function(s){return s.id===i;});}).filter(Boolean);
  var chips = songs.length ? songs.map(function(s){return '<span class="chip">♪ '+esc(s.title)+'</span>';}).join('') : '<span class="chip plain">Sem cifras vinculadas</span>';
  var adminBtns = isAdmin ? ('<button class="btn sm" onclick="event.stopPropagation();eventForm(\''+e.id+'\')">Editar</button><button class="btn sm danger" onclick="event.stopPropagation();delEvent(\''+e.id+'\')">Excluir</button>') : '';
  var routeBtn = e.address ? ('<button class="btn sm" onclick="event.stopPropagation();openRouteModal(\''+e.id+'\')">🗺 Rota</button>') : '';
  var shareBtn = '<button class="btn sm" onclick="event.stopPropagation();openShareModal(\'event\',\''+e.id+'\')">🔗 Compartilhar</button>';
  var timeLine = rep.start ? (rep.start+(rep.end?'–'+rep.end:'')+' · '+DIAF[dt.getDay()]) : DIAF[dt.getDay()];
  var multiDates = ds.length>1 ? '<div class="meta"><span class="ic">🗓</span><span>'+ds.length+' datas: '+esc(datesLabel(ds))+'</span></div>' : '';
  var rehLine = (e.rehearsals&&e.rehearsals.length) ? '<div class="meta"><span class="ic">🎤</span><span>Ensaio'+(e.rehearsals.length>1?'s':'')+': '+esc(rehLabel(e.rehearsals))+'</span></div>' : '';
  return '<article class="card" onclick="openEvent(\''+e.id+'\')" style="cursor:pointer"><div class="card-body">'+
    '<div class="evt-head">'+
      '<div class="datebox"><div class="m">'+MES[dt.getMonth()]+'</div><div class="d">'+String(dt.getDate()).padStart(2,'0')+'</div><div class="w">'+DIA[dt.getDay()]+'</div></div>'+
      '<div style="min-width:0;flex:1"><h3 class="evt-title">'+esc(e.title)+'</h3><div class="evt-time">'+timeLine+'</div></div>'+
    '</div>'+
    (e.address?'<div class="meta"><span class="ic">📍</span><span>'+esc(e.address)+'</span></div>':'')+
    multiDates+rehLine+
    (e.notes?'<div class="meta"><span class="ic">✎</span><span>'+esc(e.notes)+'</span></div>':'')+
    '<div class="chips">'+chips+'</div>'+
    '<div class="acts"><button class="btn sm primary" onclick="event.stopPropagation();openEvent(\''+e.id+'\')">Abrir repertório</button>'+routeBtn+shareBtn+adminBtns+'</div>'+
  '</div></article>';
}
function renderEvents(){
  var up=db.events.filter(function(e){return !isPast(e);}).sort(function(a,b){var da=repDateOf(a),db_=repDateOf(b);return (da.date+(da.start||'')).localeCompare(db_.date+(db_.start||''));});
  var pa=db.events.filter(isPast).sort(function(a,b){var da=lastDateOf(a),db_=lastDateOf(b);return (db_.date+(db_.start||'')).localeCompare(da.date+(da.start||''));});
  document.getElementById('upcoming').innerHTML = up.length ? up.map(eventCard).join('') : '<div class="empty"><i>✦</i>Nenhuma celebração agendada.</div>';

}

var _evDates = [], _evRehearsals = [];

/* GEOLOCALIZAÇÃO DO ADMIN — pedida ao abrir o formulário de evento (e sob demanda pelo botão 📍),
   usada apenas para refinar/priorizar os resultados da busca de endereço. */
var _adminGeo = null, _adminGeoAsked = false;
function requestAdminLocation(force){
  if(!isAdmin || !navigator.geolocation) return;
  if(_adminGeoAsked && !force) return;
  _adminGeoAsked = true;
  navigator.geolocation.getCurrentPosition(function(pos){
    _adminGeo = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    if(force) toast('Localização obtida — a busca de endereço foi refinada');
  }, function(){
    if(force) toast('Não foi possível obter sua localização (permissão negada?)');
  }, {enableHighAccuracy:false, timeout:8000, maximumAge:600000});
}

var _geoT=null, _geoAbort=null;
function geoSearch(now){
  clearTimeout(_geoT);
  var run=function(){
    var inp=document.getElementById('ev_a'),box=document.getElementById('sugg');
    if(!inp||!box)return;
    var q=inp.value.trim();
    if(q.length<3){box.classList.remove('show');return;}
    box.innerHTML='<div><span class="spin"></span> Buscando endereços…</div>';box.classList.add('show');
    if(_geoAbort) _geoAbort.abort();
    _geoAbort = new AbortController();
    geocodeBR_(q,_geoAbort.signal).then(function(j){
      if(j.length){ renderSugg_(j,box); return; }
      var tk=q.split(/[,\s]+/).filter(Boolean);
      if(tk.length>2){
        return geocodeBR_(tk.slice(-3).join(' '),_geoAbort.signal).then(function(j2){renderSugg_(j2,box);});
      }
      renderSugg_([],box);
    }).catch(function(err){
      if(err && err.name==='AbortError') return;
      box.innerHTML='<div class="muted">Busca indisponível — o texto digitado será usado.</div>';
    });
  };
  if(now) run(); else _geoT=setTimeout(run,450);
}
/* Busca em duas etapas: Photon (melhor para nomes de lugares/igrejas, com correspondência
   por prefixo) primeiro; se não encontrar nada, cai para o Nominatim como reforço. */
function geocodeBR_(q,signal){
  var url='https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=8&lang=pt';
  if(_adminGeo) url+='&lat='+_adminGeo.lat+'&lon='+_adminGeo.lng+'&location_bias_scale=0.8';
  return fetch(url,{signal:signal}).then(function(r){return r.json();}).then(function(gj){
    var feats=(gj&&gj.features)||[];
    var mapped=feats.map(function(f){
      var p=f.properties||{}, c=(f.geometry&&f.geometry.coordinates)||[];
      var parts=[p.name,p.street?(p.street+(p.housenumber?', '+p.housenumber:'')):null,p.city||p.county,p.state,p.country];
      var seen={};
      var uniq=parts.filter(Boolean).filter(function(x){if(seen[x])return false;seen[x]=1;return true;});
      return {display_name:uniq.join(', '),lat:c[1],lon:c[0]};
    }).filter(function(m){return m.lat && m.lon && m.display_name;});
    if(mapped.length) return mapped;
    return geocodeNominatim_(q,signal);
  }).catch(function(err){
    if(err && err.name==='AbortError') throw err;
    return geocodeNominatim_(q,signal);
  });
}
function geocodeNominatim_(q,signal){
  var url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(q);
  if(_adminGeo){
    var d=0.6;
    url+='&viewbox='+(_adminGeo.lng-d)+','+(_adminGeo.lat+d)+','+(_adminGeo.lng+d)+','+(_adminGeo.lat-d)+'&bounded=0';
  }
  return fetch(url,{signal:signal}).then(function(r){return r.json();}).then(function(j){
    return (j||[]).map(function(p){return {display_name:p.display_name,lat:p.lat,lon:p.lon};});
  });
}
function renderSugg_(j,box){
  if(!j.length){box.innerHTML='<div class="muted">Nenhum endereço encontrado — o texto digitado será usado.</div>';return;}
  box.innerHTML=j.map(function(p){return '<div onclick=\'pickAddr('+JSON.stringify(p.display_name)+','+p.lat+','+p.lon+')\'>📍 '+esc(p.display_name)+'</div>';}).join('');

/* IMPORTAÇÃO DE CIFRA — busca automática pela URL do Cifra Club através de um proxy
   CORS (o navegador não permite requisição direta a outro domínio). Se todos os
   proxies falharem, cai automaticamente para colagem manual do texto. */
function prettifySlug_(slug){
  return String(slug||'').split('-').map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1):w;}).join(' ');
}
/* Deduz título/artista a partir da URL do Cifra Club (…/artista/musica/). */
function metaFromUrl_(url){
  var m=String(url||'').match(/cifraclub\.com\.br\/([a-z0-9\-]+)\/([a-z0-9\-]+)/i);
  if(!m) return {title:'',artist:''};
  return {artist:prettifySlug_(m[1]), title:prettifySlug_(m[2])};
}
/* Lista de proxies CORS públicos, tentados em ordem até um funcionar. */
var CIFRA_PROXIES_=[
  function(u){return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u);},
  function(u){return 'https://corsproxy.io/?url='+encodeURIComponent(u);},
  function(u){return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u);}
];
/* Extrai título, artista, tom e corpo da cifra a partir do HTML bruto da página do Cifra Club. */
function parseCifraClubHtml_(html,url){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var out={title:'',artist:'',key:'',body:''};
  var h1=doc.querySelector('h1.t1')||doc.querySelector('h1');
  if(h1) out.title=h1.textContent.trim();
  var artistEl=doc.querySelector('h2.t3 a')||doc.querySelector('.cifra_art a')||doc.querySelector('h2 a');
  if(artistEl) out.artist=artistEl.textContent.trim();
  var tomEl=doc.querySelector('#cifra_tom a')||doc.querySelector('.cifra_tom a')||doc.querySelector('[id*="tom"] a');
  if(tomEl) out.key=tomEl.textContent.trim();
  var pre=doc.querySelector('pre#cifra_l')||doc.querySelector('pre.cifra_l')||doc.querySelector('pre');
  if(pre) out.body=pre.textContent.replace(/\u00a0/g,' ').replace(/\n{4,}/g,'\n\n').trim();
  var mu=metaFromUrl_(url);
  if(!out.title) out.title=mu.title;
  if(!out.artist) out.artist=mu.artist;
  return out;
}
/* Tenta buscar e interpretar a cifra automaticamente, testando cada proxy em sequência. */
function autoFetchCifra_(url){
  function tryAt(i){
    if(i>=CIFRA_PROXIES_.length) return Promise.reject(new Error('all_proxies_failed'));
    var pUrl=CIFRA_PROXIES_[i](url);
    return fetch(pUrl).then(function(r){
      if(!r.ok) throw new Error('http_'+r.status);
      return r.text();
    }).then(function(html){
      var parsed=parseCifraClubHtml_(html,url);
      if(!parsed.body || parsed.body.length<20) throw new Error('empty_body');
      return parsed;
    }).catch(function(){ return tryAt(i+1); });
  }
  return tryAt(0);
}
/* Lê o texto colado: separa cabeçalho (título/artista/tom) do corpo da cifra. */
function parsePastedCifra_(raw){
  var txt=String(raw||'').replace(/\r/g,'').replace(/[ \t]+$/gm,'');
  var lines=txt.split('\n');
  var out={title:'',artist:'',key:'',body:''};
  var i=0;
  while(i<lines.length && !lines[i].trim()) i++;
  var head=[];
  while(i<lines.length && head.length<4){
    var l=lines[i].trim();
    if(!l){ i++; continue; }
    if(/^\[/.test(l) || isChordLine(l)) break;
    var km=l.match(/^tom\s*[:\-]?\s*([A-G][#b]?m?)\b/i);
    if(km){ out.key=km[1]; i++; continue; }
    head.push(l); i++;
  }
  if(head.length){ out.title=head[0]; }
  if(head.length>1){ out.artist=head[1]; }
  if(out.title.indexOf(' - ')!==-1 && !out.artist){
    var parts=out.title.split(' - ');
    out.title=parts[0].trim();
    out.artist=parts.slice(1).join(' - ').trim();
  }
  out.body=lines.slice(i).join('\n').replace(/\n{4,}/g,'\n\n').trim();
  if(!out.body){ out.body=txt.trim(); out.title=out.title||''; }
  return out;
}
var impEvent='', impCollection='';
function importSheet(eventId,collectionId){
  if(!isAdmin) return toast('Apenas administradores podem importar cifras');
  impEvent=eventId||'';impCollection=collectionId||'';
  openSheet(
    '<div class="sheet-head"><h2>Importar cifra</h2><button class="x" onclick="closeSheet()">✕</button></div>'+
    '<label style="margin-top:0">Link da música do Cifra Club</label>'+
    '<input type="text" id="imp_url" placeholder="https://www.cifraclub.com.br/artista/musica/">'+
    '<div class="acts" style="justify-content:flex-start;margin:8px 0 16px">'+
      '<button class="btn gold" id="impUrlBtn" onclick="doImpUrl()">🔎 Buscar automaticamente</button>'+
    '</div>'+
    '<label>Ou cole aqui a cifra copiada</label>'+
    '<textarea id="imp_paste" placeholder="Se a busca automática falhar: abra a música no Cifra Club, selecione a cifra, copie (Ctrl+C) e cole aqui." style="height:220px"></textarea>'+
    '<div class="hint" id="impMsg">Informe o link e clique em "Buscar automaticamente". Se não funcionar, cole o texto copiado do Cifra Club abaixo.</div>'+
    '<div class="acts" style="justify-content:space-between">'+
      '<button class="btn" onclick="closeSheet()">← Voltar</button>'+
      '<button class="btn gold" id="impBtn" onclick="doImpPaste()">Continuar →</button>'+
    '</div>'
  );
}
function doImpUrl(){
  var url=document.getElementById('imp_url').value.trim();
  if(!url) return toast('Cole o link da música do Cifra Club');
  if(!/cifraclub\.com\.br/i.test(url)) return toast('Informe um link do Cifra Club');
  var btn=document.getElementById('impUrlBtn'), msg=document.getElementById('impMsg');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Buscando…'; }
  if(msg) msg.textContent='Buscando a cifra automaticamente…';
  autoFetchCifra_(url).then(function(r){
    openImportPreview(r,url,impEvent,impCollection);
  }).catch(function(){
    if(btn){ btn.disabled=false; btn.innerHTML='🔎 Buscar automaticamente'; }
    if(msg) msg.textContent='Não foi possível buscar automaticamente agora. Cole a cifra copiada abaixo e clique em "Continuar".';
    toast('Busca automática falhou — cole a cifra manualmente');
  });
}
function doImpPaste(){
  var url=document.getElementById('imp_url').value.trim();
  var raw=document.getElementById('imp_paste').value;
  if(!raw||!raw.trim()) return toast('Cole a cifra copiada do Cifra Club');
  var r=parsePastedCifra_(raw);
  if(url){
    var mu=metaFromUrl_(url);
    if(!r.title) r.title=mu.title;
    if(!r.artist) r.artist=mu.artist;
  }
  openImportPreview(r,url,impEvent,impCollection);
}
function highlightCifraStatic(body){
  return (body||'').split('\n').map(function(l){
    var mS=l.match(/^(\s*)(\[[^\]]*\])(.*)$/);
    if(mS) return mS[1]+'<i class="sec">'+esc(mS[2])+'</i>'+(mS[3].trim()?transLineStatic_(mS[3]):esc(mS[3]));
    return isChordLine(l)?transLineStatic_(l):esc(l);
  }).join('\n');
}
function transLineStatic_(l){return esc(l).replace(CHORD,function(m,pre,tok){return pre+'<b class="ch">'+tok+'</b>';});}
var _pendingImport=null;
function openImportPreview(r,url,eventId,collectionId){
  _pendingImport={title:r.title||'',artist:r.artist||'',key:r.key||'',body:r.body||'',link:url,eventId:eventId||'',collectionId:collectionId||''};
  _sRefs=[];
  var colOptions=(db.collections||[]).map(function(c){
    return '<label class="pick"><input type="checkbox" class="prevCol" value="'+c.id+'"><span><b>'+esc(c.title)+'</b></span></label>';
  }).join('');
  openSheet(
    '<div class="sheet-head"><h2>Pré-visualização</h2><button class="x" onclick="closeSheet()">✕</button></div>'+
    '<div class="grid2"><div><label>Título</label><input type="text" id="prev_t" value="'+esc(_pendingImport.title)+'"></div><div><label>Tom</label><input type="text" id="prev_k" value="'+esc(_pendingImport.key)+'"></div></div>'+
    '<label>Artista</label><input type="text" id="prev_a" value="'+esc(_pendingImport.artist)+'">'+
    '<label>Cifra</label>'+
    (_pendingImport.body ? '<div class="panel" style="overflow-x:auto"><pre class="cifra" style="font-size:16px">'+highlightCifraStatic(_pendingImport.body)+'</pre></div><textarea id="prev_b" style="display:none">'+esc(_pendingImport.body)+'</textarea>' :
      '<textarea id="prev_b" placeholder="Cole a cifra aqui"></textarea>')+
    '<label style="margin-top:16px;display:block">Referências (YouTube, Spotify, Deezer…)</label>'+
    '<div id="sRefs"></div>'+
    '<button type="button" class="btn sm" onclick="addRef()">＋ Adicionar referência</button>'+
    (db.collections.length ? ('<label style="margin-top:16px;display:block">Adicionar a coleções existentes (opcional)</label><div class="picker">'+colOptions+'</div>') : '')+
    '<div class="acts"><button class="btn primary block" onclick="confirmImportSave()">💾 Salvar cifra</button></div>'
  );
  renderRefList();
}
function confirmImportSave(){
  if(!_pendingImport) return;
  var bodyField=document.getElementById('prev_b');
  var body=bodyField?bodyField.value:_pendingImport.body;
  var t=document.getElementById('prev_t').value.trim();
  if(!t) return toast('Informe o título');
  if(!body||!body.trim()) return toast('Cole a cifra');
  var sid=uid();
  var song={id:sid,title:t,
    artist:document.getElementById('prev_a').value.trim(),
    key:document.getElementById('prev_k').value.trim(),
    body:body,link:_pendingImport.link,
    refs:_sRefs.map(function(r){return r.trim();}).filter(Boolean)};
  db.songs.push(song);
  if(_pendingImport.eventId){ var e=db.events.find(function(x){return x.id===_pendingImport.eventId;}); if(e) e.songs.push(sid); }
  if(_pendingImport.collectionId && _pendingImport.collectionId!=='NEW'){ var c=db.collections.find(function(x){return x.id===_pendingImport.collectionId;}); if(c) c.songs.push(sid); }
  var extraCols=[].slice.call(document.querySelectorAll('.prevCol:checked')).map(function(i){return i.value;});
  extraCols.forEach(function(cid){ var c=db.collections.find(function(x){return x.id===cid;}); if(c && c.songs.indexOf(sid)===-1) c.songs.push(sid); });
  var pending=_pendingImport;_pendingImport=null;
  persist();renderAll();closeSheet();
  if(pending.eventId) openEvent(pending.eventId);
  if(pending.collectionId==='NEW') toggleColPickerAfterCreate(sid);
  else if(pending.collectionId) openCollection(pending.collectionId);
  toast('Cifra salva');
}
function toggleColPickerAfterCreate(sid){
  var picker=document.getElementById('colPicker');
  if(picker){
    var input=picker.querySelector('input[value="'+sid+'"]');
    if(input) input.checked=true;
  }
}

function saveSong(id,eventId,collectionId){
  var t=document.getElementById('s_t').value.trim();
  if(!t) return toast('Informe o título');
  var data={title:t,artist:document.getElementById('s_a').value.trim(),key:document.getElementById('s_k').value.trim(),
    link:document.getElementById('s_l').value.trim(),body:document.getElementById('s_b').value,
    refs:_sRefs.map(function(r){return r.trim();}).filter(Boolean)};
  var sid=id;
  if(id){ Object.assign(db.songs.find(function(x){return x.id===id;}), data); }
  else{ sid=uid(); data.id=sid; db.songs.push(data); }
  if(eventId){ var e=db.events.find(function(x){return x.id===eventId;}); if(e && e.songs.indexOf(sid)===-1) e.songs.push(sid); }
  if(collectionId && collectionId!=='NEW'){ var c=db.collections.find(function(x){return x.id===collectionId;}); if(c && c.songs.indexOf(sid)===-1) c.songs.push(sid); }
  persist();closeSheet();renderAll();
  if(eventId) openEvent(eventId);
  if(collectionId==='NEW') toggleColPickerAfterCreate(sid);
  else if(collectionId) openCollection(collectionId);
  toast('Cifra salva');
}
function delSong(id){
  var usedE=db.events.filter(function(e){return e.songs.indexOf(id)!==-1;}).length;
  var usedC=(db.collections||[]).filter(function(c){return c.songs.indexOf(id)!==-1;}).length;
  var extra = (usedE||usedC) ? (' e de '+(usedE+usedC)+' vínculo(s)') : '';
  if(!confirm('Excluir a cifra do repositório'+extra+'?')) return;
  db.songs=db.songs.filter(function(s){return s.id!==id;});
  db.events.forEach(function(e){ e.songs=e.songs.filter(function(s){return s!==id;}); });
  (db.collections||[]).forEach(function(c){ c.songs=c.songs.filter(function(s){return s!==id;}); });
  persist();renderAll();toast('Cifra excluída');
}

/* VIEWER: transpose, zoom, auto-scroll */
var SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var FLAT={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B','Fb':'E'};
/* Um acorde: tônica + qualidade opcional + extensões + baixo opcional. Ancorado nas duas
   pontas para não casar com pedaços de palavras da letra (ex.: "Deus", "Amor", "Cada"). */
var CHORD_TOKEN='[A-G](?:#|b)?(?:m|maj|min|M|sus|dim|aug|add|º|°)?(?:[0-9]+)?(?:\\((?:[^)]*)\\))?(?:(?:sus|add|maj|min|dim|aug|b|#|\\+|-)[0-9]+)*(?:\\/[A-G](?:#|b)?)?';
var CHORD=new RegExp('(^|\\s)('+CHORD_TOKEN+')(?=\\s|$)','g');
var CHORD_FULL=new RegExp('^'+CHORD_TOKEN+'$');
var cur=null,steps=0,fz=21,playing=false,raf=null,acc=0;
/* Linha de acordes: todos (ou quase todos) os tokens são acordes válidos. */
function isChordLine(l){
  var t=l.trim();
  if(!t) return false;
  var tk=t.split(/\s+/);
  var ok=tk.filter(function(x){return CHORD_FULL.test(x);}).length;
  return ok===tk.length || (tk.length>2 && ok/tk.length>=0.8);
}
function shift(r,n){var x=FLAT[r]||r,i=SHARP.indexOf(x);return i<0?r:SHARP[(i+n+120)%12];}
function transChordToken_(tok,n){
  return tok.replace(/^([A-G](?:#|b)?)/,function(m,root){return shift(root,n);})
            .replace(/\/([A-G](?:#|b)?)$/,function(m,bass){return '/'+shift(bass,n);});
}
function transLine(l){return esc(l).replace(CHORD,function(m,pre,tok){return pre+'<b class="ch">'+transChordToken_(tok,steps)+'</b>';});}
function renderBody(){
  if(!cur) return;
  document.getElementById('vBody').innerHTML=(cur.body||'').split('\n').map(function(l){
    var mD=l.match(/^(\s*)(\[[^\]]*\])(.*)$/);
    if(mD) return mD[1]+'<i class="sec">'+esc(mD[2])+'</i>'+(mD[3].trim()?transLine(mD[3]):esc(mD[3]));
    return isChordLine(l)?transLine(l):esc(l);
  }).join('\n');
  document.getElementById('keyNow').textContent = cur.key ? (shift(cur.key.replace(/m$/,''),steps)+(/m$/.test(cur.key)?'m':'')) : (steps>0?'+'+steps:String(steps));
}
function refLabel(u){
  if(/youtu\.?be/i.test(u)) return '▶ YouTube';
  if(/spotify/i.test(u)) return '🎧 Spotify';
  if(/deezer/i.test(u)) return '🎧 Deezer';
  if(/music\.apple/i.test(u)) return '🎵 Apple Music';
  if(/soundcloud/i.test(u)) return '☁ SoundCloud';
  return '🔗 Referência';
}
function openViewer(id){
  cur=db.songs.find(function(s){return s.id===id;});if(!cur)return;
  steps=0;
  document.getElementById('vTitle').innerHTML=esc(cur.title)+'<small>'+esc(cur.artist||'')+'</small>';
  var L=document.getElementById('vLink');
  if(cur.link){L.href=cur.link;L.hidden=false;}else L.hidden=true;
  var R=document.getElementById('vRefs');
  if(cur.refs && cur.refs.length){
    R.innerHTML = cur.refs.map(function(u){return '<a class="chip" href="'+esc(u)+'" target="_blank" rel="noopener">'+refLabel(u)+'</a>';}).join('');
    R.hidden=false;
  } else { R.innerHTML=''; R.hidden=true; }
  renderBody();
  document.getElementById('vBody').style.fontSize=fz+'px';
  document.getElementById('area').scrollTop=0;
  document.getElementById('viewer').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeViewer(){
  stop();document.getElementById('viewer').classList.remove('show');
  document.body.style.overflow=document.getElementById('overlay').classList.contains('show')?'hidden':'';
}
function transpose(n,reset){steps=reset?0:steps+n;renderBody();}
function zoom(n){fz=Math.max(14,Math.min(42,fz+n));document.getElementById('vBody').style.fontSize=fz+'px';}
function togglePlay(){playing?stop():start();}
function start(){
  playing=true;acc=0;
  var b=document.getElementById('playBtn');b.classList.add('on');b.textContent='⏸ Pausar';
  var area=document.getElementById('area');var last=performance.now();
  var step=function(t){
    if(!playing)return;
    var dt=(t-last)/1000;last=t;
    acc+=dt*(Number(document.getElementById('speed').value)*4.5);
    if(acc>=1){area.scrollTop+=Math.floor(acc);acc-=Math.floor(acc);}
    if(area.scrollTop+area.clientHeight>=area.scrollHeight-1){stop();return;}
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}
function stop(){
  playing=false;cancelAnimationFrame(raf);
  var b=document.getElementById('playBtn');b.classList.remove('on');b.textContent='▶ Reproduzir';
}
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('area').addEventListener('touchstart',function(){if(playing)stop();},{passive:true});
  boot();
});

function renderAll(){refreshLock();renderEvents();renderSongs();renderCollections();updateNotifBadge();}
