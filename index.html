<style>
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--paper:#242424;--ink:#ffffff;--soft:#a0a0a0;
  --line:#333333;--line2:#404040;--accent:#d4af37;--accent-l:#2d2618;--chord:#ffb37a;
  --ok:#5fa575;--danger:#d87862;--r:16px;
  --sh:0 2px 8px rgba(0,0,0,.8),0 8px 24px -8px rgba(0,0,0,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 50%,#0f0f0f 100%);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.55;padding-bottom:130px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0;letter-spacing:.01em}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
a{color:var(--accent);text-underline-offset:3px}
.muted{color:var(--soft)}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#1a1a1a 0%,#0f0f0f 70%,rgba(15,15,15,.94) 100%);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);padding:16px 18px 0}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:48px;height:48px;flex:0 0 48px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 4px 16px -4px rgba(212,175,55,.5)}
.brand h1{font-size:1.5rem;line-height:1.05;font-weight:700;letter-spacing:.02em}
.kicker{display:block;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px}
.lockbtn{margin-left:auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 15px;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
.lockbtn.on{background:var(--accent-l);border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:2px;margin-top:16px}
.tab{flex:1;padding:14px 4px 12px;border:none;background:none;cursor:pointer;position:relative;font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--soft)}
.tab.active{color:var(--accent)}
.tab.active::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;background:var(--accent)}
main{max-width:860px;margin:0 auto;padding:22px 18px 40px}
.orn{display:flex;align-items:center;gap:14px;margin:28px 0 16px}
.orn h2{font-size:1.6rem;white-space:nowrap;font-weight:700}
.orn .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.orn .dot{color:var(--accent);font-size:.8rem}
.empty{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:40px 22px;text-align:center;color:var(--soft);box-shadow:var(--sh)}
.empty i{display:block;font-style:normal;font-size:2rem;margin-bottom:8px;color:var(--accent);opacity:.6}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),#8b7a4f)}
.card-body{padding:20px 20px 20px 22px}
.evt-head{display:flex;gap:16px;align-items:flex-start}
.datebox{flex:0 0 66px;text-align:center;background:var(--accent-l);border:1px solid var(--accent);border-radius:14px 14px 10px 10px;padding:9px 4px 8px}
.datebox .m{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.datebox .d{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;line-height:1;color:var(--accent)}
.datebox .w{font-size:.6rem;color:var(--soft);letter-spacing:.06em}
.evt-title{font-size:1.65rem;line-height:1.12;font-weight:700}
.evt-time{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:3px}
.meta{display:flex;gap:9px;align-items:flex-start;font-size:.92rem;color:var(--soft);margin-top:12px;line-height:1.4}
.meta .ic{flex:0 0 auto;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.chip{background:var(--accent-l);border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:600}
.chip.plain{background:var(--bg2);border-color:var(--line);color:var(--soft)}
a.chip{text-decoration:none;display:inline-block}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btn{border-radius:12px;padding:13px 18px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.94rem;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.4);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#c89ba8,var(--accent));border-color:var(--accent);color:#000;font-weight:700}
.btn.gold{background:linear-gradient(180deg,#b8970d,var(--accent));border-color:var(--accent);color:#000;font-weight:700}
.btn.danger{color:var(--danger);border-color:#6d4c42;background:var(--paper)}
.btn.block{width:100%}
.btn.sm{padding:9px 13px;font-size:.83rem;border-radius:10px}
.btn.icon{padding:9px 11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:45;background:linear-gradient(180deg,#b8970d,var(--accent));color:#000;border:none;border-radius:999px;padding:17px 26px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 10px 26px -8px rgba(212,175,55,.8)}
.acc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:30px;box-shadow:var(--sh)}
.acc-head{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:20px;display:flex;align-items:center;gap:12px;font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700}
.acc-head .count{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-l);border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.acc-body{padding:0 14px 16px;display:none}
.acc.open .acc-body{display:block}
.acc.open .caret{transform:rotate(180deg)}
.caret{transition:transform .2s;color:var(--accent)}
.past .card{opacity:.6}
.past .card::before{background:#5a5248}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.searchwrap{position:relative;margin-bottom:18px}
.search{width:100%;padding:16px 16px 16px 46px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--sh)}
.searchwrap .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--soft)}
.song{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:11px;box-shadow:var(--sh);cursor:pointer}
.song-acts{display:flex;flex-direction:column;align-items:stretch;gap:6px;flex:0 0 auto}
.song-acts .keyb{text-align:center}
.song:active{background:rgba(212,175,55,.1)}
.num{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:linear-gradient(135deg,#3d3420,#2d2418);border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.si-info{flex:1;min-width:0}
.si-info h3{font-size:1.3rem;line-height:1.18;font-weight:600;overflow-wrap:break-word;word-break:normal}
.si-info p{margin:1px 0 0;font-size:.85rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keyb{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:6px 11px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.88rem;color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 34px);animation:up .24s cubic-bezier(.2,.8,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.9)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet-head h2{font-size:1.6rem;flex:1;font-weight:700;line-height:1.15}
.x{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:42px;height:42px;font-size:1rem;cursor:pointer;flex:0 0 42px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:18px 0 8px}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:230px;font-family:'JetBrains Mono',monospace;font-size:.9rem;line-height:1.55;white-space:pre;overflow-x:auto}
.hint{font-size:.8rem;color:var(--soft);margin-top:8px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:10px;align-items:stretch}
.inline input{flex:1;min-width:0}
.picker{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--sh)}
.pick{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.pick:last-child{border-bottom:none}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 22px}
.pick span{flex:1;min-width:0}
.pick b{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;overflow-wrap:break-word;word-break:normal}
iframe.map{width:100%;height:210px;border:0;border-radius:14px;margin-top:12px;background:#000;box-shadow:var(--sh)}
.sugg{background:var(--paper);border:1px solid var(--line);border-radius:13px;margin-top:8px;overflow:hidden;box-shadow:var(--sh);display:none}
.sugg.show{display:block}
.sugg div{padding:13px 15px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:.88rem;line-height:1.35}
.sugg div:last-child{border-bottom:none}
.daterow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.daterow input[type=date]{flex:1.3;min-width:0}
.daterow input[type=time]{flex:1;min-width:0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #5a5248;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--sh);margin-top:6px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:13px 8px;font-weight:700;font-size:.92rem;cursor:pointer;color:var(--soft)}
.seg button.on{background:linear-gradient(180deg,#8b970d,var(--accent));color:#000;box-shadow:0 4px 12px -6px rgba(212,175,55,.8)}
.panel{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:16px;margin-top:12px;box-shadow:var(--sh)}
.res{display:flex;align-items:center;gap:12px;padding:15px 16px;border:1px solid var(--line);background:var(--paper);border-radius:14px;margin-bottom:10px;box-shadow:var(--sh)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;line-height:1.15;overflow-wrap:break-word;word-break:normal}
.res .t span{font-size:.85rem;color:var(--soft)}
.counter{font-size:.8rem;color:var(--soft);margin:16px 0 10px;letter-spacing:.02em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;display:none;align-items:center;justify-content:center}
